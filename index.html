<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zicolicious Tech & Accessories</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      color: #333;
      padding-bottom: 50px;
    }

    header {
      background-color: #111;
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-area h1 {
      font-size: 1.5rem;
    }

    .logo-area p {
      font-size: 0.85rem;
      color: #aaa;
    }

    .cart-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: #ffffff;
      border-radius: 10px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    .product-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #111;
    }

    .product-desc {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.8rem;
      border-top: 1px solid #f0f0f0;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2563eb;
    }

    .add-btn {
      background-color: #10b981;
      color: #ffffff;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:hover {
      background-color: #059669;
    }

    /* CART MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 0;
      border-bottom: 1px solid #eee;
    }

    .remove-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .cart-total {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      text-align: right;
    }

    .checkout-btn {
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0.8rem;
      margin-top: 1rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <h1>Zicolicious Tech & Accessories</h1>
      <p>Your Favorite Tech Store</p>
    </div>
    <button class="cart-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
  </header>

  <main class="container">
    <div id="product-grid" class="product-grid"></div>
  </main>

  <!-- CART MODAL -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Your Shopping Cart</h2>
        <button class="close-btn" onclick="closeCart()">&times;</button>
      </div>
      <div id="cart-items"></div>
      <div class="cart-total">
        Total: ₦<span id="cart-total-price">0</span>
      </div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Smart Watch Bluetooth Call", price: 15000, desc: "Sleek smartwatch featuring full touch screen display and direct Bluetooth calling." },
      { id: 2, name: "B39 LED Wireless Headset", price: 13000, desc: "Over-ear Bluetooth headphones with glowing RGB LED light ring design." },
      { id: 3, name: "Smart Bluetooth Sunglasses", price: 12000, desc: "Hands-free wireless audio sunglasses with built-in earphones and mic." },
      { id: 4, name: "P47 Wireless Stereo Headphones", price: 8500, desc: "Foldable wireless over-ear headphones with deep bass and high clarity." },
      { id: 5, name: "P9 Wireless Over-Ear Headphones", price: 16000, desc: "Premium metallic finish over-ear headphones with soft cushioned earcups." },
      { id: 6, name: "HiFi Bass Cannon Bluetooth Headphones", price: 17500, desc: "3D deep bass over-ear headphones supporting card playback and HD calls." },
      { id: 7, name: "Guixia Pro8s TWS Earbuds", price: 11000, desc: "Sleek black in-ear wireless Bluetooth earbuds with compact charging case." },
      { id: 8, name: "Pro4 White Wireless Earbuds", price: 11000, desc: "4-5h single use duration with up to 48h total endurance charging case." },
      { id: 9, name: "Square Case Matte Black Earbuds", price: 12500, desc: "Modern square charging case design with ergonomic touch-control earbuds." },
      { id: 10, name: "TWS Semi-In-Ear Earphones", price: 10500, desc: "Clear voice calls and deep bass performance with a curved capsule case." },
      { id: 11, name: "Invisible Open-Ear Earbuds", price: 12000, desc: "Open-ear clip design for comfortable long wear without ear fatigue." },
      { id: 12, name: "Sport Wireless Neckband - Sky Blue", price: 9500, desc: "Flexible magnetic wireless neckband headset with rich stereo sound." },
      { id: 13, name: "EAGEAT F9 TWS Wireless Earbuds", price: 11000, desc: "Digital LED power display case with true bass wireless audio." },
      { id: 14, name: "Litglobe Pro6 Ear-Hook Earphones", price: 13000, desc: "Secure ear-hook design for sports, 24-hour total battery life with case." },
      { id: 15, name: "Owin 10000mAh Power Bank", price: 14000, desc: "22.5W Super Fast Charge with built-in charging cables and LED display." },
      { id: 16, name: "Easypie 20000mAh Power Bank", price: 18500, desc: "Dual 2A fast charging output ports with two-way rapid charging support." },
      { id: 17, name: "50000mAh Container Power Bank - Red", price: 28000, desc: "Ultra-high capacity container design with built-in multi-cables & digital display." },
      { id: 18, name: "50000mAh Container Power Bank - Black", price: 28000, desc: "Heavy-duty 50,000mAh fast-charging power bank in matte black container style." },
      { id: 19, name: "Portable Desktop Fan with LED Display", price: 8500, desc: "Compact 4-leaf cooling fan with digital battery level display and fold stand." },
      { id: 20, name: "Oppselve Flexible Tripod Stand", price: 6500, desc: "Flexible octopus legs mount for phones and compact cameras." },
      { id: 21, name: "Universal Smartwatch Clip Charger Cable", price: 3500, desc: "2-pin clip-on USB charging cable compatible with various smartwatch models." }
    ];

    let cart = [];

    function renderProducts() {
      const container = document.getElementById("product-grid");
      container.innerHTML = products.map(product => `
        <div class="product-card">
          <h3 class="product-title">${product.name}</h3>
          <p class="product-desc">${product.desc}</p>
          <div class="product-bottom">
            <span class="product-price">₦${product.price.toLocaleString()}</span>
            <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      cart.push(product);
      updateCartUI();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById("cart-count").innerText = cart.length;
      
      const cartItemsContainer = document.getElementById("cart-items");
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = "<p>Your cart is currently empty.</p>";
      } else {
        cartItemsContainer.innerHTML = cart.map((item, index) => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              ₦${item.price.toLocaleString()}
            </div>
            <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("cart-total-price").innerText = total.toLocaleString();
    }

    function openCart() {
      document.getElementById("cart-modal").style.display = "flex";
    }

    function closeCart() {
      document.getElementById("cart-modal").style.display = "none";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      alert(`Thank you for your order! Your total is ₦${total.toLocaleString()}`);
      cart = [];
      updateCartUI();
      closeCart();
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderProducts();
      updateCartUI();
    });
  </script>
</body>
</html>
